<!doctype html>
<meta charset="utf-8">
<title>Animation — orange zigzag draw-on</title>
<!--
  Telliskivi zigzag motif, drawn on as it scrolls into view.
  Used on: index.html (large divider between the intro and stats
  sections), and the contact block on every page. A smaller variant
  sits under the active tab on hinnad-ja-plaanid.html.

  Self-contained. Open directly to preview (click Replay).

  Notes for the dev team:
  - The draw is stroke-dasharray/dashoffset, so it scales cleanly and
    needs no JS beyond adding the .is-visible class.
  - stroke-dasharray must be >= the path length. 620 covers the large
    494x124 version; shrink it for smaller ones or read it from
    path.getTotalLength().
  - Add .is-visible when the element enters the viewport
    (IntersectionObserver). Reduced motion: skip the transition.
-->
<style>
  .zz {
    width: 494px;
    height: 124px;
    overflow: visible;
    fill: none;
    stroke: #FC4C02;
    stroke-width: 14;
    stroke-linecap: butt;
  }
  .zz polyline {
    stroke-dasharray: 620;
    stroke-dashoffset: 620;
    transition: stroke-dashoffset 1100ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .zz.is-visible polyline { stroke-dashoffset: 0; }

  .zz--sm { width: 46px; height: 14px; stroke-width: 4; }
  .zz--sm polyline { stroke-dasharray: 70; stroke-dashoffset: 70; transition-duration: 500ms; }

  @media (prefers-reduced-motion: reduce) {
    .zz polyline { transition: none; stroke-dashoffset: 0; }
  }

  body { margin: 0; padding: 60px; font: 14px system-ui; display: flex; flex-direction: column; gap: 32px; align-items: flex-start; }
  button { padding: 8px 16px; font: inherit; cursor: pointer; }
</style>

<svg class="zz is-visible" viewBox="0 0 494 124" preserveAspectRatio="none" aria-hidden="true">
  <polyline points="4,120 126,6 247,120 368,6 490,120" />
</svg>

<svg class="zz zz--sm is-visible" viewBox="0 0 100 30" aria-hidden="true">
  <polyline points="3,27 26,4 50,27 74,4 97,27" />
</svg>

<button onclick="document.querySelectorAll('.zz').forEach(function(s){s.classList.remove('is-visible');setTimeout(function(){s.classList.add('is-visible')},50)})">Replay</button>
